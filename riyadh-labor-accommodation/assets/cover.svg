<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<!-- صورة الغلاف: مجمع سكن جماعي مخطط على أطراف مدينة صحراوية عند الأصيل.
     رسم متجهي مضمّن (لا طلبات خارجية). لاستبدالها بصورة فوتوغرافية فعلية:
     ضع الملف في assets/cover.jpg وحدّث IMAGES['cover'] في build.py. -->
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#EDE4D6"/>
    <stop offset="42%"  stop-color="#F5EFE4"/>
    <stop offset="72%"  stop-color="#FAF6EE"/>
    <stop offset="100%" stop-color="#F7F2E8"/>
  </linearGradient>
  <radialGradient id="sun" cx="0.29" cy="0.52" r="0.42">
    <stop offset="0%"   stop-color="#FFF3DC" stop-opacity="0.95"/>
    <stop offset="55%"  stop-color="#FBEAD0" stop-opacity="0.42"/>
    <stop offset="100%" stop-color="#FBEAD0" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#EFE7D8"/>
    <stop offset="100%" stop-color="#E4DAC7"/>
  </linearGradient>
  <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#E7DECB"/>
    <stop offset="100%" stop-color="#DCD1BB"/>
  </linearGradient>
  <linearGradient id="roofA" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#D9D2C2"/><stop offset="100%" stop-color="#C9C1AF"/>
  </linearGradient>
  <linearGradient id="faceA" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FBF8F2"/><stop offset="100%" stop-color="#EDE7DA"/>
  </linearGradient>
  <linearGradient id="faceB" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#EFE9DC"/><stop offset="100%" stop-color="#DFD7C6"/>
  </linearGradient>
  <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F7F2E8" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#F7F2E8" stop-opacity="0"/>
  </linearGradient>

  <!-- وحدة سكنية: واجهة بشبكة نوافذ ومظلات أفقية -->
  <symbol id="blk" viewBox="0 0 200 96" preserveAspectRatio="none">
    <rect x="0" y="10" width="200" height="86" fill="url(#faceA)"/>
    <rect x="0" y="4"  width="200" height="9"  fill="url(#roofA)"/>
    <g fill="#B9C3BA" opacity="0.62">
      <rect x="12" y="24" width="17" height="12" rx="1.5"/><rect x="41" y="24" width="17" height="12" rx="1.5"/>
      <rect x="70" y="24" width="17" height="12" rx="1.5"/><rect x="99" y="24" width="17" height="12" rx="1.5"/>
      <rect x="128" y="24" width="17" height="12" rx="1.5"/><rect x="157" y="24" width="17" height="12" rx="1.5"/>
      <rect x="12" y="49" width="17" height="12" rx="1.5"/><rect x="41" y="49" width="17" height="12" rx="1.5"/>
      <rect x="70" y="49" width="17" height="12" rx="1.5"/><rect x="99" y="49" width="17" height="12" rx="1.5"/>
      <rect x="128" y="49" width="17" height="12" rx="1.5"/><rect x="157" y="49" width="17" height="12" rx="1.5"/>
      <rect x="12" y="74" width="17" height="12" rx="1.5"/><rect x="41" y="74" width="17" height="12" rx="1.5"/>
      <rect x="70" y="74" width="17" height="12" rx="1.5"/><rect x="99" y="74" width="17" height="12" rx="1.5"/>
      <rect x="128" y="74" width="17" height="12" rx="1.5"/><rect x="157" y="74" width="17" height="12" rx="1.5"/>
    </g>
    <rect x="0" y="41" width="200" height="3" fill="#CFC7B6" opacity="0.85"/>
    <rect x="0" y="66" width="200" height="3" fill="#CFC7B6" opacity="0.85"/>
    <rect x="0" y="91" width="200" height="5" fill="#C6BDA9" opacity="0.7"/>
  </symbol>

  <!-- نخلة -->
  <symbol id="plm" viewBox="0 0 60 100">
    <path d="M29 100 L29 44 Q30 40 31.5 44 L31.5 100Z" fill="#7E7256"/>
    <g fill="#5E7A5C" opacity="0.9">
      <path d="M30 44 Q12 34 3 40 Q14 30 30 41Z"/>
      <path d="M30 44 Q48 34 57 40 Q46 30 30 41Z"/>
      <path d="M30 43 Q17 26 9 20 Q24 26 31 40Z"/>
      <path d="M30 43 Q43 26 51 20 Q36 26 29 40Z"/>
      <path d="M30 42 Q28 24 30 12 Q34 26 32 42Z"/>
    </g>
  </symbol>
</defs>

<!-- السماء -->
<rect width="1600" height="900" fill="url(#sky)"/>
<rect width="1600" height="900" fill="url(#sun)"/>

