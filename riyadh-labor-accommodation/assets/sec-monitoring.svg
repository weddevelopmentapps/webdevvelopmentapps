  <path d="M140 320 L286 246"/><path d="M380 320 L472 240"/>
  <path d="M640 320 L672 234"/><path d="M900 320 L868 228"/>
</g>

<!-- الجدار الأيمن: أبواب الغرف -->
<path d="M1200 0 L1200 320 L980 268 L980 46Z" fill="#F4F2EC"/>
<g fill="#DCD6C7" opacity="0.9">
