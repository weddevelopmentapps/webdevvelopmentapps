<!-- ضوء نهاري داخل -->
<path d="M104 60 L520 214 L520 320 L104 258Z" fill="url(#clight)" opacity="0.55"/>

<!-- منطقة طعام مشتركة في العمق -->
<g opacity="0.9">
  <rect x="470" y="176" width="252" height="9" rx="2" fill="#C9B899"/>
  <rect x="470" y="185" width="252" height="4" fill="#B7A585" opacity="0.8"/>
  <g fill="#D6D2C6">
    <rect x="486" y="189" width="7" height="34"/><rect x="700" y="189" width="7" height="34"/>
  </g>
  <!-- مقاعد -->
  <g fill="#CFCABB">
    <rect x="452" y="196" width="30" height="6" rx="2"/><rect x="710" y="196" width="30" height="6" rx="2"/>
    <rect x="452" y="202" width="5" height="22"/><rect x="477" y="202" width="5" height="22"/>
    <rect x="710" y="202" width="5" height="22"/><rect x="735" y="202" width="5" height="22"/>
