<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
<!-- رأس قسم الرقابة والامتثال: ممر مرفق سكني مشترك بإضاءة نهارية -->
<defs>
  <linearGradient id="cwall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FBFBF8"/><stop offset="100%" stop-color="#EFEEE8"/>
  </linearGradient>
  <linearGradient id="cfloor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#E8E5DC"/><stop offset="100%" stop-color="#DAD6CA"/>
  </linearGradient>
  <linearGradient id="clight" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFFDF6" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#FFFDF6" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="1200" height="320" fill="url(#cwall)"/>

<!-- أرضية بمنظور -->
<path d="M0 320 L0 246 L1200 214 L1200 320Z" fill="url(#cfloor)"/>
<g stroke="#CFCABC" stroke-width="1.6" opacity="0.7" fill="none">
