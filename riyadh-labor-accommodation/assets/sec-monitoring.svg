  <path d="M1016 84 L1016 236 L982 228 L982 80Z"/>
</g>
<g fill="#B4A98D" opacity="0.65">
  <circle cx="1134" cy="162" r="4"/><circle cx="1051" cy="162" r="3.4"/><circle cx="986" cy="160" r="3"/>
</g>

<!-- الجدار الأيسر: نوافذ كبيرة -->
