<header id="masthead">
  <div class="inner">
    <div id="emblem">
      <div class="logo-plate"><img src="__LOGO_EMBLEM__" alt="شعار الهيئة الملكية لمدينة الرياض"></div>
      <div class="mast-title">
        <div class="entity">الهيئة الملكية لمدينة الرياض</div>
        <h1 id="mast-h1">منصة استدامة كفاءة الإنفاق</h1>
        <div class="sub" id="mast-sub"></div>
      </div>
    </div>
    <div class="mast-spacer"></div>
    <div class="mast-meta">
      <div class="mast-chips">
        <span class="chip live"><span class="dot"></span><span id="asof-chip"></span></span>
        <span class="chip demo" id="demo-chip" title="تُستبدل بالبيانات الفعلية عند التشغيل">بيانات تجريبية لأغراض العرض</span>
      </div>
      <div class="mast-actions">
        <button class="mbtn" id="btn-export" title="تصدير البيانات (JSON)">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
          تصدير
        </button>
        <button class="mbtn" id="btn-import" title="استيراد البيانات (JSON)">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 15V3m0 0L8 7m4-4l4 4M4 21h16"/></svg>
          استيراد
        </button>
        <button class="mbtn" id="btn-print" title="طباعة الشاشة الحالية">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M6 9V3h12v6M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v7H6z"/></svg>
          طباعة
        </button>
        <button class="mbtn gold" id="btn-reset" title="استرجاع بيانات العرض الأصلية">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          استرجاع
        </button>
      </div>
    </div>
  </div>
</header>

<nav id="tabbar" aria-label="أقسام المنصة">
  <div class="inner" id="tabbar-inner"></div>
</nav>

<main id="app"></main>

<div id="overlay"></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-label="تفاصيل">
  <div class="dh"><h3 id="drawer-title"></h3><button class="x" id="drawer-x" aria-label="إغلاق">✕</button></div>
  <div class="db" id="drawer-body"></div>
</aside>

<div id="modal" role="dialog" aria-modal="true" aria-label="نموذج إدخال">
  <div class="mbox">
    <div class="mhead"><h3 id="modal-title"></h3><button class="x btn ghost" id="modal-x" aria-label="إغلاق">✕</button></div>
    <div class="mbody" id="modal-body"></div>
    <div class="mfoot" id="modal-foot"></div>
  </div>
</div>

<nav id="bottomnav" aria-label="التنقل السفلي"><div class="bn-inner" id="bn-inner"></div></nav>
<div id="moresheet" role="dialog" aria-modal="true" aria-label="المزيد"><div class="grab"></div><div id="ms-body"></div></div>

<div id="toast" hidden><span class="tk">✓</span><span id="toast-msg"></span></div>
<input type="file" id="import-file" accept="application/json" hidden>
